# ============================================================
# WheelsOnRent — Production Nginx Config
# Domain: api.wheelsonrentroad.com
# Deploy to: /etc/nginx/sites-available/wheelsonrent-api
# Symlink:   ln -s /etc/nginx/sites-available/wheelsonrent-api /etc/nginx/sites-enabled/
# ============================================================

# Rate Limiting Zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream
upstream wheelsonrent_backend {
    server 127.0.0.1:5000;
    keepalive 4;
}

# ── HTTP Server (works immediately, also handles ACME for Certbot) ──
server {
    listen 80;
    server_name api.wheelsonrentroad.com;

    client_max_body_size 5M;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # Backend API
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://wheelsonrent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Socket.IO — WebSocket
    location /socket.io/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://wheelsonrent_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health Check (no rate limit, no access log)
    location = /health {
        proxy_pass http://wheelsonrent_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}

